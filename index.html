<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#181625"><title>わたしの家計簿</title><style>
:root{color-scheme:dark;--bg:#181625;--card:#242131;--field:#2d293b;--line:#413b53;--text:#f3f1f8;--muted:#b9b3c8;--primary:#a89bff;--red:#ff829b;--green:#67d8ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button,input,select{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field);color:var(--text);min-height:44px}input,select{width:100%;min-width:0}button:hover{border-color:var(--primary)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary)}main{max-width:960px;margin:auto;padding:24px 16px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:1.8rem;margin:0}h2{font-size:1.1rem;margin:0 0 16px}p,.muted,small{color:var(--muted)}.actions{display:flex;align-items:center;gap:8px;min-width:0}.month{display:flex;gap:6px;min-width:0}.month input{width:155px}.icon{position:relative;width:44px;padding:8px;flex-shrink:0}.icon svg{width:22px;height:22px}.badge{position:absolute;top:-6px;right:-5px;background:var(--red);color:#181625;border-radius:20px;padding:2px 5px;font-size:11px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.total{font-size:clamp(1rem,3vw,1.6rem);font-weight:800;margin-top:8px;overflow-wrap:anywhere}.income{color:var(--green)}.expense{color:var(--red)}.balance{color:var(--primary)}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}.stack{display:grid;gap:18px;align-content:start}form{display:grid;gap:12px}label{display:grid;gap:6px;color:var(--muted);font-size:.87rem}.primary{background:var(--primary);color:#201c31;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.details{min-width:0;overflow-wrap:anywhere}.item-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.item-actions button{font-size:.8rem;padding:6px 9px}.price{font-weight:800;white-space:nowrap}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tools button{font-size:.8rem}.pill{display:inline-block;background:var(--field);padding:2px 6px;border-radius:8px;font-size:.75rem}.empty{padding:20px;text-align:center;color:var(--muted)}.bar{height:7px;background:var(--field);border-radius:8px;margin-top:6px;overflow:hidden}.bar span{display:block;height:100%;background:var(--primary)}dialog{width:min(660px,calc(100% - 24px));max-height:calc(100dvh - 32px);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px}dialog::backdrop{background:#0009}.dialog-head{margin-bottom:16px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button.active{background:var(--primary);color:var(--bg)}.setting-add{display:flex;gap:8px}.setting-add input{flex:1}.setting-list{margin-bottom:20px}
#notificationPanel{display:none;position:fixed;z-index:50;top:110px;right:16px;width:min(390px,calc(100vw - 32px));max-height:calc(100dvh - 130px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px #0007;overflow:hidden}#notificationPanel.open{display:flex;flex-direction:column}.panel-head{padding:12px;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}.panel-head h2{margin:0}.panel-head button{font-size:.75rem;padding:6px}#notificationList{overflow:auto;min-height:0;padding:0 14px}.unread{border-left:3px solid var(--primary);padding-left:8px}.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:16px;right:16px;max-width:500px;margin:auto;padding:14px;background:var(--field);border:1px solid var(--primary);border-radius:12px;z-index:100;box-shadow:0 8px 30px #0008}.toast[hidden]{display:none}.toast.error{border-color:var(--red)}#status{font-size:.85rem;overflow-wrap:anywhere}
@media(max-width:720px){.layout{grid-template-columns:1fr}.actions{width:100%}.month{flex:1}.month input{flex:1;width:0}.card{padding:16px}#notificationPanel{left:16px;right:16px;width:auto;top:90px;max-height:calc(100dvh - 110px)}.item.row{align-items:flex-start}.item-actions{max-width:150px}.summary .card{padding:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><div><h1>わたしの家計簿</h1><p>毎日の出費を、さっと記録。</p></div><div class="actions"><button class="icon" id="bell" aria-label="通知" aria-controls="notificationPanel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="badge" class="badge" hidden></span></button><button class="icon" id="settingsButton" aria-label="設定">⚙</button><div class="month"><button id="prev" aria-label="前月">‹</button><input type="month" id="month" aria-label="表示月"><button id="next" aria-label="翌月">›</button></div></div></header><section class="summary"><div class="card"><small>収入</small><div id="income" class="total income"></div></div><div class="card"><small>支出</small><div id="expense" class="total expense"></div></div><div class="card"><small>差額</small><div id="balance" class="total balance"></div></div></section><section class="layout"><aside class="card"><h2>明細を追加</h2><form id="recordForm" novalidate><label>種類<select id="type"><option value="expense">支出</option><option value="income">収入</option></select></label><label>日付<input type="date" id="date" required></label><label>カテゴリ<select id="category"></select></label><label>金額（矢印で10円ずつ）<input id="amount" type="number" step="any" min="1" inputmode="numeric" required placeholder="例：680"></label><label>支払い方法（任意）<select id="payment"></select></label><label>メモ（任意）<input id="memo" maxlength="60"></label><button class="primary">記録する</button></form><div class="tools"><button id="export">バックアップを書き出す</button><button id="import">バックアップを復元</button><input type="file" id="file" accept=".json,application/json" hidden></div><p id="status" role="status"></p></aside><div class="stack"><section class="card"><div class="row"><h2>明細一覧</h2><small id="count"></small></div><div id="records"></div></section><section class="card"><div class="row"><h2>毎月の固定支出</h2><button id="addRecurring">＋追加</button></div><div id="recurringList"></div></section><section class="card"><h2>カテゴリ別支出</h2><div id="categoryTotals"></div></section></div></section></main>
<section id="notificationPanel" aria-label="通知履歴"><div class="row panel-head"><h2>通知</h2><div><button id="readAll">すべて既読</button><button id="clearAll">すべて削除</button><button id="closePanel" aria-label="通知を閉じる">×</button></div></div><div id="notificationList"></div></section>
<dialog id="recurringDialog"><div class="row dialog-head"><h2 id="recurringTitle">定額支出を追加</h2><button type="button" id="closeRecurring">×</button></div><form id="recurringForm" novalidate><label>項目名<input id="rName" maxlength="40" required></label><label>カテゴリ<select id="rCategory"></select></label><label>毎月の金額（矢印で10円ずつ）<input id="rAmount" type="number" step="any" min="1" required inputmode="numeric"></label><label>計上日<select id="rDay"></select></label><label>支払い方法（任意）<select id="rPayment"></select></label><label>開始月<input type="month" id="rStart" required></label><label>終了月（任意）<input type="month" id="rEnd"></label><p id="editHelp" hidden>変更はこの固定支出の過去・未来の自動明細にも反映されます。</p><div class="row"><button type="button" id="cancelRecurring">キャンセル</button><button class="primary" id="saveRecurring">登録する</button></div></form></dialog>
<dialog id="settingsDialog"><div class="row dialog-head"><h2>設定</h2><button id="closeSettings">×</button></div><div class="tabs"><button data-tab="payments" class="active">支払い方法・カード</button><button data-tab="categories">カテゴリ</button></div><div id="settingsContent"></div></dialog><dialog id="recordEditDialog"><div class="row dialog-head"><h2>明細を編集</h2><button type="button" id="closeRecordEdit" aria-label="閉じる">×</button></div><form id="recordEditForm" novalidate><label>種類<select id="eType"><option value="expense">支出</option><option value="income">収入</option></select></label><label>日付<input type="date" id="eDate" required></label><label>カテゴリ<select id="eCategory"></select></label><label>金額（矢印で10円ずつ）<input type="number" id="eAmount" step="10" min="0" inputmode="numeric" required></label><label>支払い方法（任意）<select id="ePayment"></select></label><label>メモ（任意）<input id="eMemo" maxlength="60"></label><div class="row"><button type="button" id="cancelRecordEdit">キャンセル</button><button class="primary">変更を保存</button></div></form></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const KEY='meganezaru-kakeibo-records-v2',LEGACY='meganezaru-kakeibo-records-v1';const defaults={expense:['食費','交通費','日用品','通信費','サブスク','趣味・ゲーム','推し活・グッズ','イベント・遠征','カラオケ','美容・服','学業・制作','交際費','その他'],income:['給与・バイト','仕送り','返金','お小遣い','その他']};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),yen=v=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY'}).format(v),uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function normalize(p){if(Array.isArray(p))p={records:p};return {records:p.records||[],recurring:p.recurring||[],notifications:p.notifications||[],categories:{expense:p.categories?.expense?.length?p.categories.expense:[...defaults.expense],income:p.categories?.income?.length?p.categories.income:[...defaults.income]},paymentMethods:p.paymentMethods?.length?p.paymentMethods:['現金','カード']}}
let state,loadError=false;try{state=normalize(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(LEGACY)||'{}'))}catch{state=normalize({});loadError=true}let editing=null,settingsTab='payments',toastTimer;
function display(message,type='success'){ $('status').textContent=message;$('toast').textContent=message;$('toast').className='toast '+type;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,type==='error'?7000:4000)}
function persist(next){try{localStorage.setItem(KEY,JSON.stringify({version:6,...next}));state=next;return true}catch{display('保存できませんでした。データは変更していません。ブラウザの保存設定・容量を確認してください。','error');return false}}
function notify(message,type='success',log=true){display(message,type);if(log){const next=structuredClone(state);next.notifications.unshift({id:uid(),message,type,createdAt:new Date().toISOString(),read:$('notificationPanel').classList.contains('open')});next.notifications=next.notifications.slice(0,100);if(!persist(next))display(message+'（通知履歴の保存に失敗しました）','error');renderNotifications()}}
function commit(change,message){let next=structuredClone(state);change(next);if(!persist(next))return false;render();notify(message);return true}
function options(el,values,optional=false){let old=el.value;el.innerHTML=(optional?'<option value="">選択しない</option>':'')+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if(values.includes(old)||optional&&old==='')el.value=old}
function refreshOptions(){options($('category'),state.categories[$('type').value]);options($('payment'),state.paymentMethods,true);options($('rCategory'),state.categories.expense);options($('rPayment'),state.paymentMethods,true)}
function monthly(){let m=$('month').value;let rr=state.recurring.filter(r=>r.startMonth<=m&&(!r.endMonth||r.endMonth>=m)).map(r=>{let[y,n]=m.split('-').map(Number),day=Math.min(r.day,new Date(y,n,0).getDate());return {...r,id:'fixed-'+r.id,type:'expense',date:m+'-'+String(day).padStart(2,'0'),memo:r.name,fixed:true}});return [...state.records.filter(r=>r.date.startsWith(m)),...rr].sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))}
function render(){refreshOptions();let rows=monthly(),income=rows.filter(r=>r.type==='income').reduce((s,r)=>s+Number(r.amount),0),expense=rows.filter(r=>r.type==='expense').reduce((s,r)=>s+Number(r.amount),0);$('income').textContent=yen(income);$('expense').textContent=yen(expense);$('balance').textContent=yen(income-expense);$('count').textContent=rows.length+'件';$('records').innerHTML=rows.map(r=>`<article class="row item"><div class="details"><strong>${esc(r.category)}</strong> ${r.paymentMethod?`<span class="pill">${esc(r.paymentMethod)}</span>`:''}<div><small>${esc(r.date)} ${esc(r.memo)} ${r.fixed?'・固定':''}</small></div></div><div><div class="price ${r.type}">${r.type==='expense'?'−':'+'}${yen(r.amount)}</div>${r.fixed?'':`<div class="item-actions"><button data-edit-record="${esc(r.id)}">編集</button><button data-copy="${esc(r.id)}">コピー</button><button data-del="${esc(r.id)}">削除</button></div>`}</div></article>`).join('')||'<div class="empty">この月の明細はありません。</div>';
$('recurringList').innerHTML=state.recurring.map(r=>`<article class="row item"><div class="details"><strong>${esc(r.name)}</strong><div><small>${esc(r.category)}・毎月${r.day}日 ${esc(r.paymentMethod||'')}</small></div><div><small>${esc(r.startMonth)} 〜 ${esc(r.endMonth||'継続中')}</small></div></div><div><div class="price expense">${yen(r.amount)}</div><div class="item-actions"><button data-edit-fixed="${esc(r.id)}">編集</button><button data-del-fixed="${esc(r.id)}">削除</button></div></div></article>`).join('')||'<div class="empty">固定支出はまだありません。</div>';let totals=new Map();rows.filter(r=>r.type==='expense').forEach(r=>totals.set(r.category,(totals.get(r.category)||0)+Number(r.amount)));$('categoryTotals').innerHTML=[...totals].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="row"><span>${esc(k)}</span><span>${yen(v)}</span></div><div class="bar"><span style="width:${expense?v/expense*100:0}%"></span></div></div>`).join('')||'<div class="empty">支出はありません。</div>';renderNotifications()}
$('date').value=today();$('month').value=today().slice(0,7);$('rDay').innerHTML=Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('');$('type').onchange=refreshOptions;
$('recordForm').onsubmit=e=>{e.preventDefault();let a=Number($('amount').value);if(!$('date').value||!Number.isSafeInteger(a)||a<1||!$('category').value){notify('日付・カテゴリ・1円以上の整数の金額を入力してください。','error');return}let r={id:uid(),date:$('date').value,type:$('type').value,category:$('category').value,amount:a,paymentMethod:$('payment').value,memo:$('memo').value.trim(),createdAt:new Date().toISOString()};if(commit(s=>s.records.push(r),`${r.type==='expense'?'支出':'収入'}を登録しました：${r.category} ${yen(a)}`)){$('month').value=r.date.slice(0,7);$('amount').value='';$('memo').value='';$('payment').value='';render()}};
function openRecurring(id=null){editing=id;let r=id?state.recurring.find(r=>r.id===id):null;if(id&&!r)return;refreshOptions();$('recurringForm').reset();$('recurringTitle').textContent=r?'固定支出を編集':'定額支出を追加';$('saveRecurring').textContent=r?'変更を保存':'登録する';$('editHelp').hidden=!r;$('rName').value=r?.name||'';$('rAmount').value=r?.amount||'';$('rDay').value=r?.day||1;$('rCategory').value=r?.category||state.categories.expense[0];$('rPayment').value=r?.paymentMethod||'';$('rStart').value=r?.startMonth||$('month').value;$('rEnd').value=r?.endMonth||'';$('recurringDialog').showModal();$('rName').focus()}
$('addRecurring').onclick=()=>openRecurring();for(let id of ['closeRecurring','cancelRecurring'])$(id).onclick=()=>$('recurringDialog').close();
$('recurringForm').onsubmit=e=>{e.preventDefault();let a=Number($('rAmount').value),name=$('rName').value.trim(),start=$('rStart').value,end=$('rEnd').value;if(!name||!Number.isSafeInteger(a)||a<1||!start||!$('rCategory').value){notify('項目名・カテゴリ・金額・開始月を入力してください。','error');return}if(end&&end<start){notify('終了月は開始月以降にしてください。','error');return}if(editing&&!confirm('変更は過去・未来の自動明細にも反映されます。保存しますか？'))return;let r={id:editing||uid(),name,category:$('rCategory').value,amount:a,day:Number($('rDay').value),paymentMethod:$('rPayment').value,startMonth:start,endMonth:end},isEdit=!!editing;if(commit(s=>{if(isEdit){let i=s.recurring.findIndex(x=>x.id===editing);s.recurring[i]={...s.recurring[i],...r}}else s.recurring.push(r)},`固定支出を${isEdit?'更新':'登録'}しました：${name} 毎月${yen(a)}`)){$('recurringDialog').close();editing=null}};
$('recurringList').onclick=e=>{let edit=e.target.closest('[data-edit-fixed]'),del=e.target.closest('[data-del-fixed]');if(edit)openRecurring(edit.dataset.editFixed);if(del){let r=state.recurring.find(x=>x.id===del.dataset.delFixed);if(r&&confirm(`「${r.name}」を削除しますか？過去・未来の自動明細も消えます。`))commit(s=>s.recurring=s.recurring.filter(x=>x.id!==r.id),'固定支出を削除しました：'+r.name)}};
$('records').onclick=e=>{let edit=e.target.closest('[data-edit-record]');if(edit){openRecordEdit(edit.dataset.editRecord);return}let c=e.target.closest('[data-copy]'),d=e.target.closest('[data-del]');if(c){let r=state.records.find(x=>x.id===c.dataset.copy);$('type').value=r.type;refreshOptions();$('category').value=r.category;$('date').value=today();$('amount').value=r.amount;$('payment').value=r.paymentMethod||'';$('memo').value=r.memo||'';notify('明細をコピーしました。日付を確認して登録してください。','info')}if(d){let r=state.records.find(x=>x.id===d.dataset.del);if(confirm('この明細を削除しますか？'))commit(s=>s.records=s.records.filter(x=>x.id!==r.id),'明細を削除しました。')}};
for(let[id,delta]of [['prev',-1],['next',1]])$(id).onclick=()=>{let[y,m]=$('month').value.split('-').map(Number),d=new Date(y,m-1+delta,1);$('month').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()};$('month').onchange=()=>{if(!$('month').value)$('month').value=today().slice(0,7);render()};
function renderNotifications(){let unread=state.notifications.filter(n=>!n.read).length;$('badge').hidden=!unread;$('badge').textContent=unread;$('notificationList').innerHTML=state.notifications.map(n=>`<article class="row item ${n.read?'':'unread'}"><div class="details">${esc(n.message)}<div><small>${esc(new Date(n.createdAt).toLocaleString('ja-JP'))}</small></div></div><button data-remove-notice="${esc(n.id)}" aria-label="通知を削除">×</button></article>`).join('')||'<div class="empty">通知はありません。</div>'}
function closePanel(){$('notificationPanel').classList.remove('open');$('bell').setAttribute('aria-expanded','false')}
function positionPanel(){let p=$('notificationPanel'),rect=$('bell').getBoundingClientRect(),mobile=innerWidth<=720;let top=Math.max(12,Math.min(rect.bottom+10,innerHeight-180));p.style.top=top+'px';p.style.maxHeight=Math.max(120,innerHeight-top-16)+'px';if(!mobile)p.style.right=Math.max(16,Math.min(innerWidth-rect.right,innerWidth-406))+'px'}
$('bell').onclick=()=>{if($('notificationPanel').classList.contains('open')){closePanel();return}positionPanel();$('notificationPanel').classList.add('open');$('bell').setAttribute('aria-expanded','true');let next=structuredClone(state);next.notifications.forEach(n=>n.read=true);persist(next);renderNotifications()};$('closePanel').onclick=closePanel;$('readAll').onclick=()=>{let next=structuredClone(state);next.notifications.forEach(n=>n.read=true);if(persist(next))renderNotifications()};$('clearAll').onclick=()=>{if(confirm('通知をすべて削除しますか？')){let next=structuredClone(state);next.notifications=[];if(persist(next)){renderNotifications();notify('通知をすべて削除しました。','success',false)}}};$('notificationList').onclick=e=>{let b=e.target.closest('[data-remove-notice]');if(b){let next=structuredClone(state);next.notifications=next.notifications.filter(n=>n.id!==b.dataset.removeNotice);if(persist(next))renderNotifications()}};document.addEventListener('click',e=>{if(!e.target.closest('#notificationPanel')&&!e.target.closest('#bell'))closePanel()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});window.addEventListener('resize',()=>{if($('notificationPanel').classList.contains('open'))positionPanel()});window.addEventListener('scroll',()=>{if($('notificationPanel').classList.contains('open'))positionPanel()},{passive:true});
function settingSection(title,key,list){return `<h2>${title}</h2><form class="setting-add" data-add="${key}"><input maxlength="30" placeholder="新しい名前" required><button>追加</button></form><div class="setting-list">${list.map((name,i)=>`<div class="row item"><span class="details">${esc(name)}</span><div class="item-actions"><button data-key="${key}" data-index="${i}" data-action="rename">編集</button><button data-key="${key}" data-index="${i}" data-action="delete">削除</button></div></div>`).join('')}</div>`}
function renderSettings(){$('settingsContent').innerHTML=settingsTab==='payments'?settingSection('支払い方法・カード','payment',state.paymentMethods):settingSection('支出カテゴリ','expense',state.categories.expense)+settingSection('収入カテゴリ','income',state.categories.income)}
$('settingsButton').onclick=()=>{closePanel();renderSettings();$('settingsDialog').showModal()};$('closeSettings').onclick=()=>$('settingsDialog').close();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{settingsTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderSettings()});const getList=(s,key)=>key==='payment'?s.paymentMethods:s.categories[key];
$('settingsContent').onsubmit=e=>{e.preventDefault();let key=e.target.dataset.add,input=e.target.querySelector('input'),name=input.value.trim();if(!name||getList(state,key).includes(name)){notify('空欄または同じ名前は登録できません。','error');return}if(commit(s=>getList(s,key).push(name),'設定項目を追加しました：'+name))renderSettings()};
$('settingsContent').onclick=e=>{let b=e.target.closest('[data-action]');if(!b)return;let key=b.dataset.key,i=Number(b.dataset.index),list=getList(state,key),old=list[i],name;if(b.dataset.action==='rename'){name=prompt('新しい名前',old);if(name===null)return;name=name.trim();if(!name||name.length>30||(name!==old&&list.includes(name))){notify('有効な重複しない名前を入力してください。','error');return}}else{if(list.length<=1){notify('最低1項目は残してください。','error');return}let fallback=key==='payment'?'未選択':list.filter(x=>x!==old).includes('その他')?'その他':list.filter(x=>x!==old)[0];if(!confirm(`「${old}」を削除しますか？使用中の明細・固定支出は「${fallback}」へ変更されます。`))return;name=key==='payment'?'':fallback}
if(commit(s=>{let l=getList(s,key);if(b.dataset.action==='rename')l[i]=name;else l.splice(i,1);for(let r of [...s.records,...s.recurring]){if(key==='payment'){if(r.paymentMethod===old)r.paymentMethod=name}else if((r.type===key||!r.type&&key==='expense')&&r.category===old)r.category=name}},'設定を更新しました：'+old))renderSettings()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:6,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kakeibo-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('バックアップのダウンロードを開始しました。')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;let p=JSON.parse(await file.text()),next=normalize(p);if(!Array.isArray(next.records)||!Array.isArray(next.recurring)||!next.records.every(r=>r&&typeof r.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&['expense','income'].includes(r.type)&&typeof r.category==='string'&&Number.isSafeInteger(Number(r.amount))&&Number(r.amount)>0)||!next.recurring.every(r=>r&&typeof r.id==='string'&&typeof r.name==='string'&&typeof r.category==='string'&&/^\d{4}-\d{2}$/.test(r.startMonth)&&Number.isInteger(Number(r.day))&&r.day>=1&&r.day<=31&&Number.isSafeInteger(Number(r.amount))&&r.amount>0))throw Error();if(!confirm('明細・固定支出・設定・通知をバックアップで置き換えますか？'))return;if(persist(next)){render();notify('バックアップを復元しました。')}}catch{notify('バックアップを読み込めませんでした。JSONファイルを確認してください。','error')}finally{e.target.value=''}};
for(let id of ['amount','rAmount','eAmount']){let input=$(id);input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();let n=Number(input.value)||0;input.value=Math.max(1,n+(e.key==='ArrowUp'?10:-10))}});input.addEventListener('wheel',()=>input.blur(),{passive:true})}

let recordEditingId=null;
function editCategoryOptions(){options($('eCategory'),state.categories[$('eType').value])}
function openRecordEdit(id){const r=state.records.find(x=>x.id===id);if(!r)return;recordEditingId=id;$('eType').value=r.type;editCategoryOptions();$('eCategory').value=r.category;$('eDate').value=r.date;$('eAmount').value=r.amount;options($('ePayment'),state.paymentMethods,true);$('ePayment').value=r.paymentMethod||'';$('eMemo').value=r.memo||'';$('recordEditDialog').showModal();$('eDate').focus()}
$('eType').onchange=editCategoryOptions;
for(const id of ['closeRecordEdit','cancelRecordEdit'])$(id).onclick=()=>$('recordEditDialog').close();
$('recordEditDialog').addEventListener('close',()=>{recordEditingId=null});
$('recordEditForm').onsubmit=e=>{e.preventDefault();const id=recordEditingId,old=state.records.find(r=>r.id===id),amount=Number($('eAmount').value);if(!old){notify('編集対象の明細が見つかりません。','error');return}if(!$('eDate').value||!$('eCategory').value||!Number.isSafeInteger(amount)||amount<1){notify('日付・カテゴリ・1円以上の整数の金額を入力してください。','error');return}const changes={type:$('eType').value,date:$('eDate').value,category:$('eCategory').value,amount,paymentMethod:$('ePayment').value,memo:$('eMemo').value.trim(),updatedAt:new Date().toISOString()};if(commit(s=>{const i=s.records.findIndex(r=>r.id===id);s.records[i]={...s.records[i],...changes}},`明細を更新しました：${changes.category} ${yen(amount)}`)){$('month').value=changes.date.slice(0,7);render();$('recordEditDialog').close()}};

render();if(loadError)display('保存データを読み込めませんでした。登録前にバックアップを確認してください。','error');
</script></body></html>
