<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#181625" />
  <title>わたしの家計簿</title>
  <style>
    :root { --bg:#181625; --card:#242131; --card-strong:#2d293b; --text:#f3f1f8; --muted:#b9b3c8; --line:#413b53; --primary:#a89bff; --primary-soft:#373157; --income:#67d8ad; --income-soft:#1f493d; --expense:#ff829b; --expense-soft:#502b3b; --shadow:0 12px 32px rgba(0,0,0,.30); }
    * { box-sizing:border-box; } body { margin:0; min-width:320px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif; } button,input,select { font:inherit; } button { cursor:pointer; }
    .app { width:min(100%,960px); margin:0 auto; padding:24px 16px 56px; } header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:18px; } h1 { margin:0; font-size:clamp(1.45rem,4vw,2rem); letter-spacing:.03em; } .subtitle { margin:5px 0 0; color:var(--muted); font-size:.9rem; }
    .header-actions { display:flex; align-items:center; gap:8px; }.notification-wrap { position:relative; }.bell-button,.settings-button { position:relative; display:grid; width:42px; height:42px; place-items:center; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); box-shadow:var(--shadow); }.bell-button:hover,.bell-button.active,.settings-button:hover { color:var(--primary); background:var(--primary-soft); border-color:#665da0; }.bell-icon,.settings-icon { width:21px; height:21px; }.notification-badge { position:absolute; top:-5px; right:-5px; display:none; min-width:18px; height:18px; padding:0 4px; place-items:center; border:2px solid var(--bg); border-radius:99px; background:var(--expense); color:#241923; font-size:.66rem; font-weight:800; line-height:1; }.notification-badge.show { display:grid; }
    .notification-panel { position:absolute; top:50px; right:0; z-index:20; display:none; width:min(390px,calc(100vw - 32px)); overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--card); box-shadow:0 18px 50px rgba(0,0,0,.46); }.notification-panel.open { display:block; }.notification-panel-header { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:15px 15px 12px; border-bottom:1px solid var(--line); }.notification-panel-header h2 { margin:0; font-size:1rem; }.panel-actions { display:flex; align-items:center; gap:7px; }.text-button { padding:5px 7px; border:0; border-radius:7px; background:transparent; color:var(--primary); font-size:.75rem; font-weight:800; }.text-button:hover { background:var(--primary-soft); }.notification-list { max-height:420px; overflow:auto; }.notification-item { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start; padding:12px 14px; border-bottom:1px solid var(--line); }.notification-item:last-child { border-bottom:0; }.notification-item.unread { background:#2a2639; }.notification-dot { width:8px; height:8px; margin-top:6px; border-radius:50%; background:transparent; }.notification-item.unread .notification-dot { background:var(--primary); }.notification-content { min-width:0; }.notification-message { color:var(--text); font-size:.84rem; font-weight:700; line-height:1.45; }.notification-time { margin-top:4px; color:var(--muted); font-size:.72rem; }.notification-remove { width:25px; height:25px; border:0; border-radius:7px; background:transparent; color:var(--muted); }.notification-remove:hover { color:var(--expense); background:var(--expense-soft); }.notification-empty { padding:35px 15px; color:var(--muted); text-align:center; font-size:.86rem; }
    .month-control { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:var(--shadow); white-space:nowrap; }.month-control input { width:135px; border:0; color:var(--text); background:transparent; padding:6px; outline:none; color-scheme:dark; }.icon-button { width:34px; height:34px; border:0; border-radius:9px; background:var(--primary-soft); color:var(--primary); font-weight:800; }.icon-button:hover { filter:brightness(1.12); }
    .summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }.summary-card { border:1px solid var(--line); border-radius:16px; background:var(--card); padding:16px; box-shadow:var(--shadow); }.summary-card .label { color:var(--muted); font-size:.84rem; }.summary-card .amount { margin-top:7px; font-size:clamp(1.15rem,3.4vw,1.65rem); font-weight:800; letter-spacing:.01em; }.amount.income { color:var(--income); }.amount.expense { color:var(--expense); }.amount.balance { color:var(--primary); }
    .layout { display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:18px; align-items:start; }.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); } h2 { margin:0 0 15px; font-size:1.05rem; }.form-grid { display:grid; gap:12px; }.field { display:grid; gap:6px; } label { color:var(--muted); font-size:.84rem; font-weight:700; }
    input,select { width:100%; min-height:42px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--card-strong); color:var(--text); outline:none; color-scheme:dark; } input:focus,select:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }.type-switch { display:grid; grid-template-columns:1fr 1fr; gap:8px; }.type-switch button { min-height:40px; border:1px solid var(--line); border-radius:10px; background:var(--card-strong); color:var(--muted); font-weight:800; }.type-switch button.active.expense { color:var(--expense); border-color:var(--expense); background:var(--expense-soft); }.type-switch button.active.income { color:var(--income); border-color:var(--income); background:var(--income-soft); }
    .primary-button { min-height:46px; border:0; border-radius:11px; background:var(--primary); color:#201c31; font-weight:800; box-shadow:0 8px 18px rgba(105,91,199,.28); }.primary-button:hover { filter:brightness(1.08); }.secondary-button,.file-label { display:inline-flex; align-items:center; justify-content:center; min-height:38px; padding:8px 11px; border:1px solid var(--line); border-radius:10px; background:var(--card-strong); color:var(--text); font-size:.82rem; font-weight:700; }.secondary-button:hover,.file-label:hover { background:#363148; }.file-label input { display:none; }
    .records-header,.category-header,.recurring-header { display:flex; align-items:center; justify-content:space-between; gap:10px; }.count { color:var(--muted); font-size:.82rem; }.records { display:grid; gap:9px; }.record { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }.record:last-child { border-bottom:0; }.record-icon { width:36px; height:36px; display:grid; place-items:center; border-radius:11px; font-size:1.1rem; }.record-icon.expense { background:var(--expense-soft); }.record-icon.income { background:var(--income-soft); }.record-main { min-width:0; }.record-title { display:flex; gap:6px; align-items:baseline; min-width:0; }.record-category { font-size:.94rem; font-weight:800; }.record-memo { color:var(--muted); font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.record-date { color:var(--muted); font-size:.76rem; margin-top:3px; }.payment-pill { display:inline-block; margin-left:5px; padding:2px 6px; border-radius:99px; background:#3a3549; color:#d5d0e2; font-size:.66rem; font-weight:800; vertical-align:1px; }.record-side { display:flex; align-items:center; gap:6px; }.record-amount { font-weight:800; white-space:nowrap; }.record-amount.expense { color:var(--expense); }.record-amount.income { color:var(--income); }
    .delete-button,.copy-button { width:29px; height:29px; border:0; border-radius:8px; color:var(--muted); background:#393544; }.delete-button:hover { color:var(--expense); background:var(--expense-soft); }.copy-button:hover { color:var(--primary); background:var(--primary-soft); }
    .empty { padding:30px 8px; text-align:center; color:var(--muted); font-size:.9rem; }.categories,.recurring { margin-top:18px; }.category-list { display:grid; gap:10px; }.category-row { display:grid; grid-template-columns:86px 1fr auto; gap:9px; align-items:center; font-size:.83rem; }.category-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.bar { height:9px; overflow:hidden; background:#3a3549; border-radius:999px; }.bar > span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#c0b7ff,var(--primary)); }.category-amount { font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap; }
    .recurring-list { display:grid; gap:8px; margin-top:13px; }.recurring-item { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }.recurring-item:last-child { border-bottom:0; }.recurring-name { font-weight:800; font-size:.9rem; }.recurring-meta { margin-top:4px; color:var(--muted); font-size:.76rem; }.recurring-actions { display:flex; align-items:center; gap:7px; }.recurring-amount { color:var(--expense); font-weight:800; white-space:nowrap; }.small-button { min-height:32px; padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card-strong); color:var(--text); font-size:.74rem; font-weight:800; }.small-button:hover { background:var(--primary-soft); color:var(--primary); border-color:var(--primary); }
    .modal-backdrop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(8,7,13,.68); z-index:30; }.modal-backdrop.open { display:flex; }.modal { width:min(100%,470px); max-height:calc(100vh - 32px); overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.52); }.modal.wide { width:min(100%,660px); }.modal-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }.modal-title h2 { margin:0; }.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }.cancel-button { min-height:43px; padding:8px 13px; border:1px solid var(--line); border-radius:10px; background:var(--card-strong); color:var(--text); font-weight:700; }
    .settings-tabs { display:flex; gap:6px; margin:-2px 0 16px; padding-bottom:10px; border-bottom:1px solid var(--line); overflow:auto; }.settings-tab { flex:1; min-width:max-content; min-height:36px; padding:7px 10px; border:0; border-radius:9px; background:#393544; color:var(--muted); font-size:.8rem; font-weight:800; }.settings-tab.active { background:var(--primary-soft); color:var(--primary); }.settings-pane { display:none; }.settings-pane.active { display:block; }.settings-help { margin:-3px 0 13px; color:var(--muted); font-size:.78rem; line-height:1.45; }.settings-add { display:grid; grid-template-columns:1fr auto; gap:8px; margin-bottom:12px; }.settings-add .small-button { min-height:42px; }.settings-list { display:grid; gap:7px; }.settings-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#292535; }.settings-item-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.88rem; font-weight:800; }.settings-item-actions { display:flex; gap:5px; }.mini-button { min-height:28px; padding:4px 7px; border:0; border-radius:7px; background:#393544; color:var(--muted); font-size:.7rem; font-weight:800; }.mini-button:hover { color:var(--primary); background:var(--primary-soft); }.mini-button.danger:hover { color:var(--expense); background:var(--expense-soft); }.category-type-title { margin:15px 0 7px; color:var(--muted); font-size:.78rem; font-weight:800; }.category-type-title:first-of-type { margin-top:0; }
    .tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }.notice { min-height:18px; margin:11px 0 0; color:var(--muted); font-size:.78rem; }.error { color:var(--expense); }
    .toast { position:fixed; left:50%; bottom:22px; z-index:40; display:flex; align-items:center; gap:9px; width:min(calc(100% - 32px),460px); padding:13px 16px; border:1px solid #665da0; border-radius:13px; background:var(--card-strong); color:var(--text); box-shadow:0 15px 40px rgba(0,0,0,.4); transform:translate(-50%,140%); opacity:0; pointer-events:none; transition:transform .25s ease,opacity .25s ease; font-size:.9rem; font-weight:700; }.toast.show { transform:translate(-50%,0); opacity:1; }.toast.success { border-color:#3c7d68; }.toast.success .toast-icon { background:var(--income-soft); color:var(--income); }.toast.error { border-color:#8e4657; }.toast.error .toast-icon { background:var(--expense-soft); color:var(--expense); }.toast.info .toast-icon { background:var(--primary-soft); color:var(--primary); }.toast-icon { display:grid; flex:0 0 25px; width:25px; height:25px; place-items:center; border-radius:50%; font-size:.85rem; }.toast-message { line-height:1.35; }
    @media (max-width:720px) { .app { padding-top:18px; } header { align-items:flex-start; flex-direction:column; }.header-actions { width:100%; justify-content:space-between; }.month-control { flex:1; justify-content:space-between; }.month-control input { flex:1; }.summary-grid { gap:8px; }.summary-card { padding:12px; border-radius:13px; }.summary-card .label { font-size:.76rem; }.layout { grid-template-columns:1fr; }.card { padding:16px; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>わたしの家計簿</h1><p class="subtitle">毎日の出費を、さっと記録。</p></div><div class="header-actions"><div class="notification-wrap"><button class="bell-button" id="bellButton" type="button" aria-label="通知を開く" aria-expanded="false"><svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notification-badge" id="notificationBadge">0</span></button><section class="notification-panel" id="notificationPanel" aria-label="通知"><div class="notification-panel-header"><h2>通知</h2><div class="panel-actions"><button class="text-button" id="readAllButton" type="button">すべて既読</button><button class="text-button" id="clearAllButton" type="button">すべて削除</button></div></div><div class="notification-list" id="notificationList"></div></section></div><button class="settings-button" id="openSettings" type="button" aria-label="設定を開く"><svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.12 2.12-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V20.2h-3v-.08a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2.12-2.12.06-.06A1.65 1.65 0 0 0 7.18 15a1.65 1.65 0 0 0-1.51-1H5.6v-3h.07a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06L8.91 6l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V4.8h3v.08a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2.12 2.12-.06.06A1.65 1.65 0 0 0 19.4 10c.2.6.77 1 1.4 1h.08v3h-.08a1.65 1.65 0 0 0-1.4 1Z"/></svg></button><div class="month-control" aria-label="表示月"><button class="icon-button" id="prevMonth" aria-label="前の月">‹</button><input id="monthPicker" type="month" aria-label="表示する月"><button class="icon-button" id="nextMonth" aria-label="次の月">›</button></div></div></header>
    <section class="summary-grid" aria-label="月の集計"><div class="summary-card"><div class="label">収入</div><div class="amount income" id="incomeTotal">¥0</div></div><div class="summary-card"><div class="label">支出</div><div class="amount expense" id="expenseTotal">¥0</div></div><div class="summary-card"><div class="label">差額</div><div class="amount balance" id="balanceTotal">¥0</div></div></section>
    <section class="layout"><aside class="card"><h2>明細を追加</h2><form id="recordForm" class="form-grid" novalidate><div class="field"><label>種類</label><div class="type-switch"><button type="button" class="active expense" data-type="expense">支出</button><button type="button" class="income" data-type="income">収入</button></div></div><div class="field"><label for="date">日付</label><input id="date" type="date" required></div><div class="field"><label for="category">カテゴリ</label><select id="category" required></select></div><div class="field"><label for="amount">金額 <span style="font-weight:400">（矢印で10円ずつ）</span></label><input id="amount" type="number" min="10" step="10" inputmode="numeric" placeholder="例：680" required></div><div class="field"><label for="paymentMethod">支払い方法 <span style="font-weight:400">（任意）</span></label><select id="paymentMethod"></select></div><div class="field"><label for="memo">メモ <span style="font-weight:400">（任意）</span></label><input id="memo" type="text" maxlength="60" placeholder="例：学食"></div><button class="primary-button" type="submit">記録する</button></form><div class="tools"><button class="secondary-button" id="exportButton" type="button">バックアップを書き出す</button><label class="file-label">バックアップを復元<input id="importInput" type="file" accept="application/json"></label></div><p class="notice" id="notice" aria-live="polite"></p></aside><div><section class="card"><div class="records-header"><h2>明細一覧</h2><span class="count" id="recordCount">0件</span></div><div class="records" id="records"></div></section><section class="card recurring"><div class="recurring-header"><div><h2>毎月の固定支出</h2><span class="count" id="recurringCount">0件</span></div><button class="small-button" id="openRecurringModal" type="button">＋ 定額支出を追加</button></div><div class="recurring-list" id="recurringList"></div></section><section class="card categories"><div class="category-header"><h2>カテゴリ別支出</h2><span class="count" id="categoryHint"></span></div><div class="category-list" id="categoryList"></div></section></div></section>
  </main>
  <div class="modal-backdrop" id="recurringModal" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="recurringModalTitle"><div class="modal-title"><h2 id="recurringModalTitle">定額支出を追加</h2><button class="delete-button" type="button" id="closeRecurringModal" aria-label="閉じる">×</button></div><form id="recurringForm" class="form-grid" novalidate><div class="field"><label for="recurringName">項目名</label><input id="recurringName" type="text" maxlength="40" placeholder="例：Netflix" required></div><div class="field"><label for="recurringCategory">カテゴリ</label><select id="recurringCategory" required></select></div><div class="field"><label for="recurringAmount">毎月の金額 <span style="font-weight:400">（矢印で10円ずつ）</span></label><input id="recurringAmount" type="number" min="10" step="10" inputmode="numeric" placeholder="例：890" required></div><div class="field"><label for="recurringDay">計上日</label><select id="recurringDay"></select></div><div class="field"><label for="recurringPaymentMethod">支払い方法 <span style="font-weight:400">（任意）</span></label><select id="recurringPaymentMethod"></select></div><div class="field"><label for="recurringStart">開始月</label><input id="recurringStart" type="month" required></div><div class="field"><label for="recurringEnd">終了月 <span style="font-weight:400">（任意）</span></label><input id="recurringEnd" type="month"></div><div class="modal-actions"><button type="button" class="cancel-button" id="cancelRecurring">キャンセル</button><button class="primary-button" type="submit">定額支出を登録</button></div></form></section></div>
  <div class="modal-backdrop" id="settingsModal" aria-hidden="true"><section class="modal wide" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="modal-title"><h2 id="settingsTitle">設定</h2><button class="delete-button" type="button" id="closeSettings" aria-label="閉じる">×</button></div><div class="settings-tabs"><button class="settings-tab active" type="button" data-settings-tab="payments">支払い方法・カード</button><button class="settings-tab" type="button" data-settings-tab="categories">カテゴリ</button></div><section class="settings-pane active" data-settings-pane="payments"><p class="settings-help">現金・カード以外の支払い方法や、利用するカード名を追加・編集できます。ここでの変更は、過去明細の表示にも反映されます。</p><form class="settings-add" id="paymentAddForm"><input id="newPaymentMethod" maxlength="30" placeholder="例：PayPay、三井住友カード" required><button class="small-button" type="submit">追加</button></form><div class="settings-list" id="paymentMethodList"></div></section><section class="settings-pane" data-settings-pane="categories"><p class="settings-help">支出カテゴリ・収入カテゴリを追加、名前変更、削除できます。名前変更は過去明細と固定支出にも反映されます。</p><div class="category-type-title">支出カテゴリ</div><form class="settings-add" id="expenseCategoryAddForm"><input id="newExpenseCategory" maxlength="30" placeholder="例：医療費" required><button class="small-button" type="submit">追加</button></form><div class="settings-list" id="expenseCategoryList"></div><div class="category-type-title">収入カテゴリ</div><form class="settings-add" id="incomeCategoryAddForm"><input id="newIncomeCategory" maxlength="30" placeholder="例：フリマ売上" required><button class="small-button" type="submit">追加</button></form><div class="settings-list" id="incomeCategoryList"></div></section></section></div>
  <div class="toast info" id="toast" role="status" aria-live="polite"><span class="toast-icon" id="toastIcon">i</span><span class="toast-message" id="toastMessage"></span></div>
  <script>
    const STORAGE_KEY='meganezaru-kakeibo-records-v2',LEGACY_STORAGE_KEY='meganezaru-kakeibo-records-v1';

    recurringForm.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('#recurringAmount').value),name=$('#recurringName').value.trim();if(!name){showFeedback('定額支出の項目名を入力してください。','error');$('#recurringName').focus();return}if(!Number.isFinite(amount)||amount<=0){showFeedback('毎月の金額は1円以上で入力してください。','error');$('#recurringAmount').focus();return}if(recurringEnd.value&&recurringEnd.value<recurringStart.value){showFeedback('終了月は開始月以降にしてください。','error');recurringEnd.focus();return}const item={id:uuid(),name,category:recurringCategory.value,amount:Math.round(amount),day:Number(recurringDay.value),paymentMethod:recurringPaymentMethod.value,startMonth:recurringStart.value,endMonth:recurringEnd.value};state.recurring.push(item);if(!saveState()){state.recurring.pop();return}closeRecurringModal();render();showFeedback(`定額支出を登録しました：${item.name} 毎月${yen(item.amount)}${item.paymentMethod?`（${item.paymentMethod}）`:''}`,'success')});
    $('#exportButton').addEventListener('click',()=>{const b={version:5,exportedAt:new Date().toISOString(),...state},blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`kakeibo-backup-${todayString()}.json`;link.click();URL.revokeObjectURL(url);showFeedback('バックアップファイルを書き出しました。','success')});
    $('#importInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),rs=Array.isArray(d)?d:d.records,rr=Array.isArray(d.recurring)?d.recurring:[],nn=Array.isArray(d.notifications)?d.notifications:[],cc=d.categories,pp=d.paymentMethods;if(!Array.isArray(rs)||!rs.every(r=>r.id&&r.date&&r.type&&r.category&&Number.isFinite(Number(r.amount)))||!rr.every(r=>r.id&&r.name&&r.category&&Number.isFinite(Number(r.amount))&&r.day&&r.startMonth))throw new Error('invalid');if(!confirm(`現在の明細${state.records.length}件・定額支出${state.recurring.length}件を、バックアップの明細${rs.length}件・定額支出${rr.length}件で置き換えますか？`))return;const oldState=state;state={records:rs,recurring:rr,notifications:nn,categories:{expense:Array.isArray(cc?.expense)&&cc.expense.length?cc.expense:cloneDefaults().expense,income:Array.isArray(cc?.income)&&cc.income.length?cc.income:cloneDefaults().income},paymentMethods:Array.isArray(pp)&&pp.length?pp:[...defaultPaymentMethods]};if(!saveState()){state=oldState;return}render();showFeedback(`バックアップを復元しました：明細${rs.length}件、定額支出${rr.length}件。`,'success')}catch{showFeedback('バックアップを読み込めませんでした。家計簿のJSONファイルか確認してください。','error')}finally{e.target.value=''}});
    dateInput.value=todayString();monthPicker.value=currentMonth();render();
  </script>
</body>
</html>
